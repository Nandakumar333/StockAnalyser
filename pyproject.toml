[project]
name = "stock-analyser"
version = "1.0.0"
description = "AI-powered fundamental stock analysis tool for Indian equities"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "lxml>=5.0.0",
    "openpyxl>=3.0.0",
]

[project.scripts]
stock-analyser = "stock_analyser.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stock_analyser*"]
